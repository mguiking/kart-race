<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24H Kart Race Planner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 24px; }
  h1 { text-align: center; margin-bottom: 8px; color: #fff; font-size: 1.6rem; }
  .subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 0.9rem; }

  .legend { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 6px; font-size: 0.85rem;
    border: 2px solid transparent;
  }
  .legend-item.team-purple { background: #2a1a3e; border-color: #9b59b6; }
  .legend-item.team-white { background: #2a2a2e; border-color: #e0e0e0; }
  .legend-swatch { width: 18px; height: 18px; border-radius: 4px; }
  .legend-stints { color: #888; font-size: 0.75rem; }
  .legend-team-label {
    font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 1px 6px; border-radius: 3px;
  }
  .team-purple .legend-team-label { background: #9b59b6; color: #fff; }
  .team-white .legend-team-label { background: #e0e0e0; color: #000; }

  .section-title { font-size: 1.0rem; margin: 20px 0 8px 0; color: #ccc; }

  .timeline-container { position: relative; margin-bottom: 12px; }
  .time-crosshair {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: rgba(255, 255, 255, 0.7); z-index: 20; pointer-events: none;
  }
  .time-crosshair::after {
    content: ''; position: absolute; top: -4px; left: -3px;
    width: 8px; height: 8px; background: #fff; border-radius: 50%;
  }
  .time-axis {
    display: flex; position: relative; height: 20px; margin-bottom: 2px;
    font-size: 0.65rem; color: #666;
  }
  .time-mark { position: absolute; transform: translateX(-50%); }

  .timeline {
    display: flex; height: 48px; border-radius: 6px; overflow: hidden;
    border: 1px solid #333;
  }
  .stint-block {
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 600; color: #000;
    border-right: 1px solid rgba(0,0,0,0.2);
    position: relative; cursor: pointer;
    transition: filter 0.15s;
  }
  .stint-block:hover { filter: brightness(1.2); }
  .stint-block .stint-tooltip {
    display: none; position: absolute; bottom: 110%; left: 50%;
    transform: translateX(-50%); background: #000; color: #fff;
    padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;
    white-space: nowrap; z-index: 10;
  }
  .stint-block:hover .stint-tooltip { display: block; }

  .stint-dropdown {
    position: fixed;
    background: #16213e; border: 1px solid #444; border-radius: 6px;
    z-index: 100; min-width: 120px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .stint-dropdown-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 0.8rem;
    color: #e0e0e0; transition: background 0.1s;
  }
  .stint-dropdown-item:hover { background: #1a3a5c; }
  .stint-dropdown-item .dd-swatch {
    width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
  }
  .stint-dropdown-item.active { background: #1a3a5c; font-weight: 700; }

  .pitstop-block {
    background: #111; flex-shrink: 0;
    position: relative;
  }
  .pitstop-block .stint-tooltip {
    display: none; position: absolute; bottom: 110%; left: 50%;
    transform: translateX(-50%); background: #000; color: #fff;
    padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;
    white-space: nowrap; z-index: 10;
  }
  .pitstop-block:hover .stint-tooltip { display: block; }

  .strategist-timeline { height: 36px; }
  .strategist-timeline .stint-block { font-size: 0.55rem; opacity: 0.85; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px; margin-top: 24px;
  }
  .driver-card {
    background: #16213e; border-radius: 8px; padding: 14px;
    border-left: 4px solid;
  }
  .driver-card h3 { font-size: 0.95rem; margin-bottom: 8px; }
  .driver-card .stat { font-size: 0.8rem; color: #aaa; margin: 3px 0; }
  .driver-card .stat span { color: #fff; }
  .bar-container { height: 6px; background: #0a0a1a; border-radius: 3px; margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 3px; }

  .stint-table {
    width: 100%; max-width: 1000px; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem;
  }
  .stint-table th {
    background: #16213e; padding: 8px 12px; text-align: left; color: #888;
    font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .stint-table td { padding: 6px 12px; border-bottom: 1px solid #1e2a45; }
  .stint-table tr.current-row td {
    animation: flash 1.5s ease-in-out infinite;
  }
  @keyframes flash {
    0%, 100% { background: rgba(255, 255, 255, 0.05); }
    50% { background: rgba(255, 255, 255, 0.18); }
  }
  .stint-table tr:hover td { background: #16213e; }
  .stint-table .shift-cell { width: 10px; padding: 0; }
  .stint-table tr.current-row td.shift-cell { animation: none; }
  .stint-table tr:hover td.shift-cell { background: revert; }
  .stint-table .driver-cell { display: flex; align-items: center; gap: 8px; }
  .stint-table .table-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<h1>Kart Race Planner</h1>

<div class="legend" id="legend"></div>

<div class="timeline-container" id="race-strat-container">
  <div class="time-axis" id="time-axis-race"></div>
  <div class="timeline" id="race-timeline"></div>
  <div class="timeline strategist-timeline" id="strat-timeline" style="margin-top:2px"></div>
  <div class="time-crosshair" id="crosshair-race"></div>
</div>

<div class="section-title">Stint Schedule</div>
<table class="stint-table" id="stint-table">
  <thead><tr><th style="width:6px;padding:0"></th><th>#</th><th>Start</th><th>End</th><th>Duration</th><th>Remaining Start</th><th>Remaining End</th><th>Driver</th></tr></thead>
  <tbody></tbody>
</table>

<!-- <div class="section-title">Per-Driver Breakdown</div> -->
<div class="stats-grid" id="stats-grid"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
const TOTAL_STINTS = 6;
const RACE_HOURS = 2
const RACE_MINUTES = RACE_HOURS * 60;
const RACE_START = 16 + 24/60; // 18:24 start time in hours
const PITSTOP_SECONDS = 30;
const PITSTOP_MINUTES = PITSTOP_SECONDS / 60; // 1.5 min
const NUM_PITSTOPS = TOTAL_STINTS - 1; // 5
const TOTAL_PITSTOP_MINUTES = NUM_PITSTOPS * PITSTOP_MINUTES; // 7.5 min
const DRIVING_MINUTES = RACE_MINUTES - TOTAL_PITSTOP_MINUTES; // 1392.5 min
const STRATEGY_SHIFTS = []; // stints per shift
const SHIFT_TEAMS = ['purple'];
const TEAM_COLORS = { purple: '#9b59b6', white: '#e0e0e0' };

const drivers = [
  { id: 0, name: "Anas",     color: "#e74c3c" },
  { id: 1, name: "Max",   color: "#d1b735" },
  { id: 2, name: "Joppe",    color: "#2ecc71" }
];

let driverTeams = [
  "purple",
  "purple",
  "purple"
];

// ── STINT ASSIGNMENT (default, overridden by localStorage) ─────────────
// Driver ID for each of the 39 stints. 3 drivers do 5 stints, 4 do 6.
// 3×5 + 4×6 = 39 ✓
const defaultRaceSchedule = [0,1,2,0,1,2]
let raceSchedule = [...defaultRaceSchedule];

// ── LOCAL STORAGE ─────────────────────────────────────────────────────
const STORAGE_KEY = 'kartRacePlanner';

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    raceSchedule,
    driverTeams,
  }));
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const state = JSON.parse(raw);
    if (Array.isArray(state.raceSchedule) && state.raceSchedule.length === TOTAL_STINTS) {
      raceSchedule = state.raceSchedule;
    }
    if (Array.isArray(state.driverTeams) && state.driverTeams.length === drivers.length) {
      driverTeams = state.driverTeams;
    }
  } catch (e) { /* ignore corrupt data */ }
}

// ── STINT TIMING ───────────────────────────────────────────────────────
// Each driver drives equal total time: DRIVING_MINUTES / 7.
// 38 pitstops of 1.5 min each are inserted between stints.
// Stint boundaries are rounded to whole minutes.
function computeStintTiming(raceSchedule, drivers) {
  const numDrivers = drivers.length;
  const driverDriveMinutes = DRIVING_MINUTES / numDrivers; // equal driving time per driver

  // Count stints per driver
  const stintCounts = new Array(numDrivers).fill(0);
  raceSchedule.forEach(d => stintCounts[d]++);

  // Per-driver stint duration (driving only, exact, in minutes)
  const driverStintDuration = stintCounts.map(c => c > 0 ? driverDriveMinutes / c : 0);

  // Accumulate race clock: stint driving + pitstop after each stint (except last)
  let cumulativeExact = 0;
  const times = []; // { startMin, endMin, durationMin, pitstopAfter }
  raceSchedule.forEach((driverId, i) => {
    const dur = driverStintDuration[driverId];
    const startExact = cumulativeExact;
    cumulativeExact += dur;
    const startMin = Math.round(startExact);
    const endMin = Math.round(cumulativeExact);
    const hasPitstop = i < raceSchedule.length - 1;
    times.push({ startMin, endMin, startExact, endExact: cumulativeExact, durationMin: endMin - startMin, pitstopAfter: hasPitstop });
    if (hasPitstop) cumulativeExact += PITSTOP_MINUTES;
  });

  return { times, driverStintDuration, stintCounts };
}

// ── STRATEGY SHIFTS (fixed groupings of stints) ─────────────────────
function buildStrategyShifts(times) {
  const shifts = [];
  let stintIdx = 0;
  STRATEGY_SHIFTS.forEach((count, i) => {
    const firstStint = stintIdx;
    const lastStint = stintIdx + count - 1;
    const startMin = times[firstStint].startMin;
    const endMin = i < STRATEGY_SHIFTS.length - 1
      ? times[lastStint + 1].startMin
      : RACE_MINUTES;
    const driverIds = [...new Set(raceSchedule.slice(firstStint, lastStint + 1))];
    shifts.push({ firstStint, lastStint, startMin, endMin, durationMin: endMin - startMin, stintCount: count, driverIds });
    stintIdx += count;
  });
  return shifts;
}

// ── RENDERING ──────────────────────────────────────────────────────────
let openDropdown = null;

function formatMinutes(raceMin) {
  const totalMin = RACE_START * 60 + raceMin;
  const h = Math.floor(totalMin / 60) % 24;
  const m = Math.floor(totalMin % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function formatHMS(raceMin) {
  const totalSec = Math.round((RACE_START * 60 + raceMin) * 60);
  const h = Math.floor(totalSec / 3600) % 24;
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatRemaining(remainingMin) {
  const totalSec = Math.max(0, Math.round(remainingMin * 60));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function renderTimeAxis(containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const startMinOfDay = RACE_START * 60; // race start in minutes from midnight
  const step = 20; // minutes between labels
  for (let raceMin = 0; raceMin <= RACE_MINUTES; raceMin += step) {
    const pct = (raceMin / RACE_MINUTES) * 100;
    const absMin = Math.floor(startMinOfDay + raceMin);
    const h = Math.floor(absMin / 60) % 24;
    const m = Math.floor(absMin % 60);
    const label = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    el.innerHTML += `<span class="time-mark" style="left:${pct}%">${label}</span>`;
  }
}

function updateCrosshairs() {
  const now = new Date();
  const nowMin = ((now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60) - RACE_START * 60 + RACE_MINUTES) % RACE_MINUTES;
  const pct = (nowMin / RACE_MINUTES) * 100;
  document.getElementById('crosshair-race').style.left = pct + '%';
}

function closeDropdown() {
  if (openDropdown) { openDropdown.remove(); openDropdown = null; }
}

function showDriverDropdown(anchorEl, currentDriverId, onSelect, allowNone) {
  closeDropdown();
  const rect = anchorEl.getBoundingClientRect();
  const dd = document.createElement('div');
  dd.className = 'stint-dropdown';
  dd.style.left = rect.left + rect.width / 2 - 60 + 'px';
  dd.style.top = rect.bottom + 4 + 'px';
  if (allowNone) {
    const item = document.createElement('div');
    item.className = 'stint-dropdown-item' + (currentDriverId === null ? ' active' : '');
    item.innerHTML = `<span class="dd-swatch" style="background:#333;border:1px solid #555"></span><em>None</em>`;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      onSelect(null);
      closeDropdown();
      renderAll();
    });
    dd.appendChild(item);
  }
  drivers.forEach(d => {
    const item = document.createElement('div');
    item.className = 'stint-dropdown-item' + (currentDriverId === d.id ? ' active' : '');
    item.innerHTML = `<span class="dd-swatch" style="background:${d.color}"></span>${d.name}`;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      onSelect(d.id);
      closeDropdown();
      renderAll();
    });
    dd.appendChild(item);
  });
  document.body.appendChild(dd);
  openDropdown = dd;
}

document.addEventListener('click', (e) => {
  if (openDropdown && !openDropdown.contains(e.target)) closeDropdown();
});

function renderAll() {
  const { times, driverStintDuration, stintCounts } = computeStintTiming(raceSchedule, drivers);
  const shifts = buildStrategyShifts(times);

  // Legend — show stint count, per-stint duration, and team
  // const legend = document.getElementById('legend');
  // legend.innerHTML = '';
  // drivers.forEach((d, i) => {
  //   const count = stintCounts[i];
  //   const durMin = count > 0 ? Math.round(driverStintDuration[i]) : 0;
  //   const team = driverTeams[i];
  //   const item = document.createElement('div');
  //   item.className = `legend-item team-${team}`;
  //   item.innerHTML = `
  //     <div class="legend-swatch" style="background:${d.color}"></div>
  //     ${d.name} <span class="legend-stints">(${count} &times; ${durMin} min)</span>
  //     <span class="legend-team-label">${team}</span>`;
  //   item.addEventListener('dblclick', (e) => {
  //     e.stopPropagation();
  //     driverTeams[i] = driverTeams[i] === 'purple' ? 'white' : 'purple';
  //     renderAll();
  //   });
  //   legend.appendChild(item);
  // });

  // Time axis
  renderTimeAxis('time-axis-race');

  // Race timeline — variable width per stint with pitstops
  const raceTL = document.getElementById('race-timeline');
  raceTL.innerHTML = '';
  const pitWidthPct = (PITSTOP_MINUTES / RACE_MINUTES) * 100;
  raceSchedule.forEach((driverId, stint) => {
    const d = drivers[driverId];
    const t = times[stint];
    const widthPct = (t.durationMin / RACE_MINUTES) * 100;
    const block = document.createElement('div');
    block.className = 'stint-block';
    block.style.cssText = `width:${widthPct}%;background:${d.color}`;
    block.innerHTML = `${d.name.substring(0, 3)}<span class="stint-tooltip">Stint ${stint + 1}: ${d.name}<br>${formatMinutes(t.startMin)} – ${formatMinutes(t.endMin)} (${t.durationMin} min)</span>`;
    block.addEventListener('click', (e) => {
      e.stopPropagation();
      showDriverDropdown(block, driverId, (newId) => { raceSchedule[stint] = newId; });
    });
    raceTL.appendChild(block);

    if (t.pitstopAfter) {
      const pit = document.createElement('div');
      pit.className = 'pitstop-block';
      pit.style.cssText = `width:${pitWidthPct}%`;
      pit.innerHTML = `<span class="stint-tooltip">Pitstop ${stint + 1}<br>${formatMinutes(t.endMin)} – ${formatMinutes(t.endMin + PITSTOP_MINUTES)} (${PITSTOP_SECONDS}s)</span>`;
      raceTL.appendChild(pit);
    }
  });

  // Strategy shifts timeline
  const stratEl = document.getElementById('strat-timeline');
  stratEl.innerHTML = '';
  shifts.forEach((shift, i) => {
    const widthPct = (shift.durationMin / RACE_MINUTES) * 100;
    const team = SHIFT_TEAMS[i];
    const teamColor = TEAM_COLORS[team];
    const textColor = team === 'white' ? '#000' : '#fff';
    const driverNames = shift.driverIds.map(id => drivers[id].name).join(', ');
    const blk = document.createElement('div');
    blk.className = 'stint-block';
    blk.style.cssText = `width:${widthPct}%;background:${teamColor};color:${textColor};cursor:default`;
    blk.innerHTML = `Strategy shift ${i + 1}<span class="stint-tooltip">Shift ${i + 1} — Team ${team} (${shift.stintCount} stints)<br>${formatMinutes(shift.startMin)} – ${formatMinutes(shift.endMin)}<br>Drivers: ${driverNames}</span>`;
    stratEl.appendChild(blk);
  });

  // Stint table — highlight current row
  const now = new Date();
  const nowMin = ((now.getHours() * 60 + now.getMinutes()) - RACE_START * 60 + RACE_MINUTES) % RACE_MINUTES;

  // Build stint-to-shift lookup
  const stintShift = [];
  shifts.forEach((shift, i) => {
    for (let j = shift.firstStint; j <= shift.lastStint; j++) stintShift[j] = i;
  });

  const tbody = document.querySelector('#stint-table tbody');
  tbody.innerHTML = '';
  raceSchedule.forEach((driverId, s) => {
    const d = drivers[driverId];
    const t = times[s];
    const isCurrent = nowMin >= t.startMin && nowMin < t.endMin;
    const pitEnd = t.endMin + PITSTOP_MINUTES;
    const isPitCurrent = t.pitstopAfter && nowMin >= t.endMin && nowMin < pitEnd;
    const teamColor = TEAM_COLORS[SHIFT_TEAMS[stintShift[s]]];
    const pitEndExact = t.endExact + PITSTOP_MINUTES;
    const remainingStart = RACE_MINUTES - t.startExact;
    const remainingEnd = RACE_MINUTES - t.endExact;
    tbody.innerHTML += `<tr${isCurrent ? ' class="current-row"' : ''}>
      <td class="shift-cell" style="background:${teamColor}"></td>
      <td>${s + 1}</td>
      <td>${formatHMS(t.startExact)}</td>
      <td>${formatHMS(t.endExact)}</td>
      <td>${t.durationMin} min</td>
      <td>${formatRemaining(remainingStart)}</td>
      <td>${formatRemaining(remainingEnd)}</td>
      <td><div class="driver-cell"><span class="table-swatch" style="background:${d.color}"></span>${d.name}</div></td>
    </tr>`;
    if (t.pitstopAfter) {
      const pitRemainingStart = RACE_MINUTES - t.endExact;
      const pitRemainingEnd = RACE_MINUTES - pitEndExact;
      tbody.innerHTML += `<tr style="color:darkgray;font-size:0.75rem"${isPitCurrent ? ' class="current-row"' : ''}>
        <td class="shift-cell" style="background:${teamColor}"></td>
        <td>Pit ${s+1}</td>
        <td>${formatHMS(t.endExact)}</td>
        <td>${formatHMS(pitEndExact)}</td>
        <td>${PITSTOP_SECONDS}s</td>
        <td>${formatRemaining(pitRemainingStart)}</td>
        <td>${formatRemaining(pitRemainingEnd)}</td>
        <td></td>
      </tr>`;
    }
  });

  // // Stats cards
  // const grid = document.getElementById('stats-grid');
  // grid.innerHTML = '';
  // const fmtHrs = (min) => (min / 60).toFixed(1);
  // drivers.forEach((d, i) => {
  //   const raceStintCount = stintCounts[i];
  //   const raceMin = times.reduce((sum, t, s) => raceSchedule[s] === i ? sum + t.durationMin : sum, 0);
  //   const durMin = raceStintCount > 0 ? Math.round(driverStintDuration[i]) : 0;
  //   const restMin = RACE_MINUTES - raceMin;

  //   grid.innerHTML += `
  //     <div class="driver-card" style="border-color:${d.color}">
  //       <h3 style="color:${d.color}">${d.name}</h3>
  //       <div class="stat">Racing: <span>${raceStintCount} stints × ${durMin} min = ${fmtHrs(raceMin)}h</span></div>
  //       <div class="stat">Rest: <span>${fmtHrs(restMin)}h</span></div>
  //       <div class="bar-container">
  //         <div class="bar-fill" style="width:${(raceMin/RACE_MINUTES)*100}%;background:${d.color}"></div>
  //       </div>
  //     </div>`;
  // });

  updateCrosshairs();
  saveState();
}

loadState();
renderAll();

// Update crosshairs and current-row highlight every 30 seconds
setInterval(() => {
  updateCrosshairs();
  const now = new Date();
  const nowMin = ((now.getHours() * 60 + now.getMinutes()) - RACE_START * 60 + RACE_MINUTES) % RACE_MINUTES;
  const rows = document.querySelectorAll('#stint-table tbody tr');
  const { times } = computeStintTiming(raceSchedule, drivers);
  let rowIdx = 0;
  raceSchedule.forEach((_, s) => {
    const t = times[s];
    const isCurrent = nowMin >= t.startMin && nowMin < t.endMin;
    rows[rowIdx]?.classList.toggle('current-row', isCurrent);
    rowIdx++;
    if (t.pitstopAfter) {
      const isPit = nowMin >= t.endMin && nowMin < t.endMin + PITSTOP_MINUTES;
      rows[rowIdx]?.classList.toggle('current-row', isPit);
      rowIdx++;
    }
  });
}, 30000);
</script>
</body>
</html>
