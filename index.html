<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24H Kart Race Planner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 24px; }
  h1 { text-align: center; margin-bottom: 8px; color: #fff; font-size: 1.6rem; }
  .subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 0.9rem; }

  .legend { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    background: #16213e; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem;
  }
  .legend-swatch { width: 18px; height: 18px; border-radius: 4px; }
  .legend-stints { color: #888; font-size: 0.75rem; }

  .section-title { font-size: 1.0rem; margin: 20px 0 8px 0; color: #ccc; }

  .timeline-container { position: relative; margin-bottom: 12px; }
  .time-crosshair {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: rgba(255, 255, 255, 0.7); z-index: 20; pointer-events: none;
  }
  .time-crosshair::after {
    content: ''; position: absolute; top: -4px; left: -3px;
    width: 8px; height: 8px; background: #fff; border-radius: 50%;
  }
  .time-axis {
    display: flex; position: relative; height: 20px; margin-bottom: 2px;
    font-size: 0.65rem; color: #666;
  }
  .time-mark { position: absolute; transform: translateX(-50%); }

  .timeline {
    display: flex; height: 48px; border-radius: 6px; overflow: hidden;
    border: 1px solid #333;
  }
  .stint-block {
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 600; color: #000;
    border-right: 1px solid rgba(0,0,0,0.2);
    position: relative; cursor: pointer;
    transition: filter 0.15s;
  }
  .stint-block:hover { filter: brightness(1.2); }
  .stint-block .stint-tooltip {
    display: none; position: absolute; bottom: 110%; left: 50%;
    transform: translateX(-50%); background: #000; color: #fff;
    padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;
    white-space: nowrap; z-index: 10;
  }
  .stint-block:hover .stint-tooltip { display: block; }

  .stint-dropdown {
    position: fixed;
    background: #16213e; border: 1px solid #444; border-radius: 6px;
    z-index: 100; min-width: 120px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .stint-dropdown-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 0.8rem;
    color: #e0e0e0; transition: background 0.1s;
  }
  .stint-dropdown-item:hover { background: #1a3a5c; }
  .stint-dropdown-item .dd-swatch {
    width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
  }
  .stint-dropdown-item.active { background: #1a3a5c; font-weight: 700; }

  .pitstop-block {
    background: #111; flex-shrink: 0;
    position: relative;
  }
  .pitstop-block .stint-tooltip {
    display: none; position: absolute; bottom: 110%; left: 50%;
    transform: translateX(-50%); background: #000; color: #fff;
    padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;
    white-space: nowrap; z-index: 10;
  }
  .pitstop-block:hover .stint-tooltip { display: block; }

  .strategist-timeline { height: 36px; }
  .strategist-timeline .stint-block { font-size: 0.55rem; opacity: 0.85; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px; margin-top: 24px;
  }
  .driver-card {
    background: #16213e; border-radius: 8px; padding: 14px;
    border-left: 4px solid;
  }
  .driver-card h3 { font-size: 0.95rem; margin-bottom: 8px; }
  .driver-card .stat { font-size: 0.8rem; color: #aaa; margin: 3px 0; }
  .driver-card .stat span { color: #fff; }
  .bar-container { height: 6px; background: #0a0a1a; border-radius: 3px; margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 3px; }

  .strat-config {
    font-size: 0.8rem; color: #888; font-weight: 400; display: flex; align-items: center; gap: 6px;
  }
  .strat-config select {
    background: #16213e; color: #e0e0e0; border: 1px solid #444; border-radius: 4px;
    padding: 3px 8px; font-size: 0.8rem; cursor: pointer;
  }

  .stint-table {
    width: 100%; max-width: 1000px; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem;
  }
  .stint-table th {
    background: #16213e; padding: 8px 12px; text-align: left; color: #888;
    font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .stint-table td { padding: 6px 12px; border-bottom: 1px solid #1e2a45; }
  .stint-table tr.current-row td {
    animation: flash 1.5s ease-in-out infinite;
  }
  @keyframes flash {
    0%, 100% { background: rgba(255, 255, 255, 0.05); }
    50% { background: rgba(255, 255, 255, 0.18); }
  }
  .stint-table tr:hover td { background: #16213e; }
  .stint-table .driver-cell { display: flex; align-items: center; gap: 8px; }
  .stint-table .table-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<h1>24H Kart Race Planner</h1>
<p class="subtitle">39 stints &middot; 7 drivers &middot; equal drive time per driver</p>

<div class="legend" id="legend"></div>

<div class="section-title">Racing</div>
<div class="timeline-container" id="race-container">
  <div class="time-axis" id="time-axis-race"></div>
  <div class="timeline" id="race-timeline"></div>
  <div class="time-crosshair" id="crosshair-race"></div>
</div>

<div class="section-title" style="display:flex;align-items:center;gap:12px;">
  Strategists
  <label class="strat-config">
    Primary shifts:
    <select id="strat-block-select">
      <option value="7">7 shifts (~2h 26min)</option>
      <option value="14" selected>14 shifts (~1h 13min)</option>
      <option value="21">21 shifts (~49min)</option>
      <option value="28">28 shifts (~36min)</option>
    </select>
  </label>
</div>
<div class="timeline-container" id="strat-container">
  <div class="time-axis" id="time-axis-strat"></div>
  <div class="timeline strategist-timeline" id="strat-timeline-1"></div>
  <div style="height:2px"></div>
  <div class="timeline strategist-timeline" id="strat-timeline-2"></div>
  <div class="time-crosshair" id="crosshair-strat"></div>
</div>

<div class="section-title">Stint Schedule</div>
<table class="stint-table" id="stint-table">
  <thead><tr><th>#</th><th>Start</th><th>End</th><th>Duration</th><th>Driver</th></tr></thead>
  <tbody></tbody>
</table>

<div class="section-title">Per-Driver Breakdown</div>
<div class="stats-grid" id="stats-grid"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
const TOTAL_STINTS = 39;
const RACE_HOURS = 24;
const RACE_MINUTES = RACE_HOURS * 60;
const RACE_START = 12;
const PITSTOP_SECONDS = 90;
const PITSTOP_MINUTES = PITSTOP_SECONDS / 60; // 1.5 min
const NUM_PITSTOPS = TOTAL_STINTS - 1; // 38
const TOTAL_PITSTOP_MINUTES = NUM_PITSTOPS * PITSTOP_MINUTES; // 57 min
const DRIVING_MINUTES = RACE_MINUTES - TOTAL_PITSTOP_MINUTES; // 1383 min
let STRATEGY_DAY_BLOCKS = 14; // number of day blocks (must be multiple of 7)

const drivers = [
  { id: 0, name: "Max",     color: "#e74c3c" },
  { id: 1, name: "Remy",   color: "#d1b735" },
  { id: 2, name: "Boris",    color: "#2ecc71" },
  { id: 3, name: "Remco",    color: "#3d31f8" },
  { id: 4, name: "Roel",   color: "#c57028" },
  { id: 5, name: "Bouw",     color: "#cf4cc1" },
  { id: 6, name: "Jesper",    color: "#6c646e" },
];

// ── STINT ASSIGNMENT (default, overridden by localStorage) ─────────────
// Driver ID for each of the 39 stints. 3 drivers do 5 stints, 4 do 6.
// 3×5 + 4×6 = 39 ✓
const defaultRaceSchedule = [
  1, // stint 0
  0,
  4,
  0,
  1,
  6,
  0,
  6,
  3,
  6,
  3,
  2,
  5,
  2,
  5,
  0,
  5,
  0,
  1,
  4,
  1,
  4,
  1,
  4,
  6,
  2,
  6,
  2,
  6,
  2,
  3,
  2,
  3,
  0,
  3,
  5,
  1,
  5,
  4
]
let raceSchedule = [...defaultRaceSchedule];

// ── LOCAL STORAGE ─────────────────────────────────────────────────────
const STORAGE_KEY = 'kartRacePlanner';

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    raceSchedule,
    stratSchedule,
    stratDayBlocks: STRATEGY_DAY_BLOCKS,
  }));
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const state = JSON.parse(raw);
    if (Array.isArray(state.raceSchedule) && state.raceSchedule.length === TOTAL_STINTS) {
      raceSchedule = state.raceSchedule;
    }
    if (typeof state.stratDayBlocks === 'number') {
      STRATEGY_DAY_BLOCKS = state.stratDayBlocks;
      document.getElementById('strat-block-select').value = String(STRATEGY_DAY_BLOCKS);
    }
    if (Array.isArray(state.stratSchedule) && !Array.isArray(state.stratSchedule[0])) {
      stratSchedule = state.stratSchedule;
    }
  } catch (e) { /* ignore corrupt data */ }
}

// ── STINT TIMING ───────────────────────────────────────────────────────
// Each driver drives equal total time: DRIVING_MINUTES / 7.
// 38 pitstops of 1.5 min each are inserted between stints.
// Stint boundaries are rounded to whole minutes.
function computeStintTiming(raceSchedule, drivers) {
  const numDrivers = drivers.length;
  const driverDriveMinutes = DRIVING_MINUTES / numDrivers; // equal driving time per driver

  // Count stints per driver
  const stintCounts = new Array(numDrivers).fill(0);
  raceSchedule.forEach(d => stintCounts[d]++);

  // Per-driver stint duration (driving only, exact, in minutes)
  const driverStintDuration = stintCounts.map(c => c > 0 ? driverDriveMinutes / c : 0);

  // Accumulate race clock: stint driving + pitstop after each stint (except last)
  let cumulativeExact = 0;
  const times = []; // { startMin, endMin, durationMin, pitstopAfter }
  raceSchedule.forEach((driverId, i) => {
    const dur = driverStintDuration[driverId];
    const startExact = cumulativeExact;
    cumulativeExact += dur;
    const startMin = Math.round(startExact);
    const endMin = Math.round(cumulativeExact);
    const hasPitstop = i < raceSchedule.length - 1;
    times.push({ startMin, endMin, durationMin: endMin - startMin, pitstopAfter: hasPitstop });
    if (hasPitstop) cumulativeExact += PITSTOP_MINUTES;
  });

  return { times, driverStintDuration, stintCounts };
}

// ── PRIMARY STRATEGY BLOCKS (fixed time blocks, manually assigned) ────
function buildStratBlocks() {
  const numBlocks = STRATEGY_DAY_BLOCKS;
  const blocks = [];
  for (let i = 0; i < numBlocks; i++) {
    const startMin = Math.round((i / numBlocks) * RACE_MINUTES);
    const endMin = Math.round(((i + 1) / numBlocks) * RACE_MINUTES);
    blocks.push({ startMin, endMin, durationMin: endMin - startMin });
  }
  return blocks;
}

// stratSchedule[blockIndex] = driverId or null — manually editable
const defaultStratSchedule = [
  6,
  3,
  5,
  1,
  0,
  4,
  2,
  6,
  5,
  3,
  0,
  1,
  4,
  2
]
let stratSchedule = [...defaultStratSchedule];

function initStratSchedule() {
  const blocks = buildStratBlocks();
  stratSchedule = blocks.map((_, i) => i % drivers.length);
}

// ── SECONDARY STRATEGIST (auto: driver who just finished previous stint)
function buildSecondaryStrat(raceSchedule, times) {
  return raceSchedule.map((_, s) => s > 0 ? raceSchedule[s - 1] : null);
}

// ── RENDERING ──────────────────────────────────────────────────────────
let openDropdown = null;

function formatMinutes(raceMin) {
  const totalMin = RACE_START * 60 + raceMin;
  const h = Math.floor(totalMin / 60) % 24;
  const m = Math.floor(totalMin % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function formatHMS(raceMin) {
  const totalSec = Math.round((RACE_START * 60 + raceMin) * 60);
  const h = Math.floor(totalSec / 3600) % 24;
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function renderTimeAxis(containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  for (let h = 0; h <= 24; h += 1) {
    const pct = (h / 24) * 100;
    const clockH = (RACE_START + h) % 24;
    el.innerHTML += `<span class="time-mark" style="left:${pct}%">${String(clockH).padStart(2,'0')}:00</span>`;
  }
}

function updateCrosshairs() {
  const now = new Date();
  const nowMin = ((now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60) - RACE_START * 60 + RACE_MINUTES) % RACE_MINUTES;
  const pct = (nowMin / RACE_MINUTES) * 100;
  document.getElementById('crosshair-race').style.left = pct + '%';
  document.getElementById('crosshair-strat').style.left = pct + '%';
}

function closeDropdown() {
  if (openDropdown) { openDropdown.remove(); openDropdown = null; }
}

function showDriverDropdown(anchorEl, currentDriverId, onSelect, allowNone) {
  closeDropdown();
  const rect = anchorEl.getBoundingClientRect();
  const dd = document.createElement('div');
  dd.className = 'stint-dropdown';
  dd.style.left = rect.left + rect.width / 2 - 60 + 'px';
  dd.style.top = rect.bottom + 4 + 'px';
  if (allowNone) {
    const item = document.createElement('div');
    item.className = 'stint-dropdown-item' + (currentDriverId === null ? ' active' : '');
    item.innerHTML = `<span class="dd-swatch" style="background:#333;border:1px solid #555"></span><em>None</em>`;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      onSelect(null);
      closeDropdown();
      renderAll();
    });
    dd.appendChild(item);
  }
  drivers.forEach(d => {
    const item = document.createElement('div');
    item.className = 'stint-dropdown-item' + (currentDriverId === d.id ? ' active' : '');
    item.innerHTML = `<span class="dd-swatch" style="background:${d.color}"></span>${d.name}`;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      onSelect(d.id);
      closeDropdown();
      renderAll();
    });
    dd.appendChild(item);
  });
  document.body.appendChild(dd);
  openDropdown = dd;
}

document.addEventListener('click', (e) => {
  if (openDropdown && !openDropdown.contains(e.target)) closeDropdown();
});

function renderAll() {
  const { times, driverStintDuration, stintCounts } = computeStintTiming(raceSchedule, drivers);
  const blocks = buildStratBlocks();

  // Ensure stratSchedule has the right number of blocks (in case block size changed)
  while (stratSchedule.length < blocks.length) {
    stratSchedule.push(stratSchedule.length % drivers.length);
  }
  stratSchedule.length = blocks.length;

  const secondaryStrat = buildSecondaryStrat(raceSchedule, times);

  // Legend — show stint count and per-stint duration
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  drivers.forEach((d, i) => {
    const count = stintCounts[i];
    const durMin = count > 0 ? Math.round(driverStintDuration[i]) : 0;
    legend.innerHTML += `
      <div class="legend-item">
        <div class="legend-swatch" style="background:${d.color}"></div>
        ${d.name} <span class="legend-stints">(${count} &times; ${durMin} min)</span>
      </div>`;
  });

  // Time axes
  renderTimeAxis('time-axis-race');
  renderTimeAxis('time-axis-strat');

  // Race timeline — variable width per stint with pitstops
  const raceTL = document.getElementById('race-timeline');
  raceTL.innerHTML = '';
  const pitWidthPct = (PITSTOP_MINUTES / RACE_MINUTES) * 100;
  raceSchedule.forEach((driverId, stint) => {
    const d = drivers[driverId];
    const t = times[stint];
    const widthPct = (t.durationMin / RACE_MINUTES) * 100;
    const block = document.createElement('div');
    block.className = 'stint-block';
    block.style.cssText = `width:${widthPct}%;background:${d.color}`;
    block.innerHTML = `${d.name.substring(0, 3)}<span class="stint-tooltip">Stint ${stint + 1}: ${d.name}<br>${formatMinutes(t.startMin)} – ${formatMinutes(t.endMin)} (${t.durationMin} min)</span>`;
    block.addEventListener('click', (e) => {
      e.stopPropagation();
      showDriverDropdown(block, driverId, (newId) => { raceSchedule[stint] = newId; });
    });
    raceTL.appendChild(block);

    if (t.pitstopAfter) {
      const pit = document.createElement('div');
      pit.className = 'pitstop-block';
      pit.style.cssText = `width:${pitWidthPct}%`;
      pit.innerHTML = `<span class="stint-tooltip">Pitstop ${stint + 1}<br>${formatMinutes(t.endMin)} – ${formatMinutes(t.endMin + PITSTOP_MINUTES)} (${PITSTOP_SECONDS}s)</span>`;
      raceTL.appendChild(pit);
    }
  });

  // Primary strategist timeline — fixed blocks, clickable
  const stratEl = document.getElementById('strat-timeline-1');
  stratEl.innerHTML = '';
  blocks.forEach((bl, b) => {
    const driverId = stratSchedule[b];
    const d = driverId !== null ? drivers[driverId] : null;
    const widthPct = (bl.durationMin / RACE_MINUTES) * 100;
    const blk = document.createElement('div');
    blk.className = 'stint-block';
    blk.style.cssText = `width:${widthPct}%;background:${d ? d.color : '#222'}`;
    blk.innerHTML = d
      ? `${d.name.substring(0, 3)}<span class="stint-tooltip">Primary: ${d.name}<br>${formatMinutes(bl.startMin)} – ${formatMinutes(bl.endMin)}</span>`
      : `<span style="color:#555">–</span><span class="stint-tooltip">Unassigned<br>${formatMinutes(bl.startMin)} – ${formatMinutes(bl.endMin)}</span>`;
    blk.addEventListener('click', (e) => {
      e.stopPropagation();
      showDriverDropdown(blk, driverId, (newId) => { stratSchedule[b] = newId; }, true);
    });
    stratEl.appendChild(blk);
  });

  // Secondary strategist timeline — auto: previous stint's driver
  const secEl = document.getElementById('strat-timeline-2');
  secEl.innerHTML = '';
  raceSchedule.forEach((_, stint) => {
    const driverId = secondaryStrat[stint];
    const d = driverId !== null ? drivers[driverId] : null;
    const t = times[stint];
    const widthPct = (t.durationMin / RACE_MINUTES) * 100;
    const blk = document.createElement('div');
    blk.className = 'stint-block';
    blk.style.cssText = `width:${widthPct}%;background:${d ? d.color : '#222'};cursor:default`;
    blk.innerHTML = d
      ? `${d.name.substring(0, 3)}<span class="stint-tooltip">Secondary: ${d.name} (prev driver)<br>${formatMinutes(t.startMin)} – ${formatMinutes(t.endMin)}</span>`
      : `<span style="color:#555">–</span><span class="stint-tooltip">No previous driver<br>${formatMinutes(t.startMin)} – ${formatMinutes(t.endMin)}</span>`;
    secEl.appendChild(blk);
    if (t.pitstopAfter) {
      const pit = document.createElement('div');
      pit.className = 'pitstop-block';
      pit.style.cssText = `width:${pitWidthPct}%`;
      secEl.appendChild(pit);
    }
  });

  // Stint table — highlight current row
  const now = new Date();
  const nowMin = ((now.getHours() * 60 + now.getMinutes()) - RACE_START * 60 + RACE_MINUTES) % RACE_MINUTES;

  const tbody = document.querySelector('#stint-table tbody');
  tbody.innerHTML = '';
  raceSchedule.forEach((driverId, s) => {
    const d = drivers[driverId];
    const t = times[s];
    const isCurrent = nowMin >= t.startMin && nowMin < t.endMin;
    const pitEnd = t.endMin + PITSTOP_MINUTES;
    const isPitCurrent = t.pitstopAfter && nowMin >= t.endMin && nowMin < pitEnd;
    tbody.innerHTML += `<tr${isCurrent ? ' class="current-row"' : ''}>
      <td>${s + 1}</td>
      <td>${formatHMS(t.startMin)}</td>
      <td>${formatHMS(t.endMin)}</td>
      <td>${t.durationMin} min</td>
      <td><div class="driver-cell"><span class="table-swatch" style="background:${d.color}"></span>${d.name}</div></td>
    </tr>`;
    if (t.pitstopAfter) {
      tbody.innerHTML += `<tr style="color:darkgray;font-size:0.75rem"${isPitCurrent ? ' class="current-row"' : ''}>
        <td>Pit ${s+1}</td>
        <td>${formatHMS(t.endMin)}</td>
        <td>${formatHMS(pitEnd)}</td>
        <td>${PITSTOP_SECONDS}s</td>
        <td></td>
      </tr>`;
    }
  });

  // Stats cards
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = '';
  const fmtHrs = (min) => (min / 60).toFixed(1);
  drivers.forEach((d, i) => {
    const raceStintCount = stintCounts[i];
    const raceMin = times.reduce((sum, t, s) => raceSchedule[s] === i ? sum + t.durationMin : sum, 0);
    const durMin = raceStintCount > 0 ? Math.round(driverStintDuration[i]) : 0;

    // Primary strategy time from blocks (excluding overlap with racing)
    let primaryMin = 0, primaryCount = 0;
    blocks.forEach((bl, b) => {
      if (stratSchedule[b] !== i) return;
      primaryCount++;
      let racingOverlap = 0;
      times.forEach((t, s) => {
        if (raceSchedule[s] !== i) return;
        const overlapStart = Math.max(bl.startMin, t.startMin);
        const overlapEnd = Math.min(bl.endMin, t.endMin);
        if (overlapEnd > overlapStart) racingOverlap += overlapEnd - overlapStart;
      });
      primaryMin += bl.durationMin - racingOverlap;
    });

    // Secondary strategy time (stint-aligned, excluding overlap with racing & primary)
    let secondaryMin = 0, secondaryCount = 0;
    times.forEach((t, s) => {
      if (secondaryStrat[s] !== i) return;
      if (raceSchedule[s] === i) return; // racing this stint, skip
      secondaryCount++;
      secondaryMin += t.durationMin;
    });

    const stratMin = primaryMin + secondaryMin;
    const restMin = RACE_MINUTES - raceMin - stratMin;

    grid.innerHTML += `
      <div class="driver-card" style="border-color:${d.color}">
        <h3 style="color:${d.color}">${d.name}</h3>
        <div class="stat">Racing: <span>${raceStintCount} stints × ${durMin} min = ${fmtHrs(raceMin)}h</span></div>
        <div class="stat">Strategy: <span>${fmtHrs(stratMin)}h (${primaryCount} primary + ${secondaryCount} secondary)</span></div>
        <div class="stat">Rest: <span>${fmtHrs(restMin)}h</span></div>
        <div class="bar-container">
          <div class="bar-fill" style="width:${(raceMin/RACE_MINUTES)*100}%;background:${d.color}"></div>
        </div>
      </div>`;
  });

  updateCrosshairs();
  saveState();
}

// Re-init strategy schedule when block size changes
document.getElementById('strat-block-select').addEventListener('change', (e) => {
  STRATEGY_DAY_BLOCKS = parseInt(e.target.value);
  initStratSchedule();
  renderAll();
});

loadState();
renderAll();

// Update crosshairs and current-row highlight every 30 seconds
setInterval(() => {
  updateCrosshairs();
  const now = new Date();
  const nowMin = ((now.getHours() * 60 + now.getMinutes()) - RACE_START * 60 + RACE_MINUTES) % RACE_MINUTES;
  const rows = document.querySelectorAll('#stint-table tbody tr');
  const { times } = computeStintTiming(raceSchedule, drivers);
  let rowIdx = 0;
  raceSchedule.forEach((_, s) => {
    const t = times[s];
    const isCurrent = nowMin >= t.startMin && nowMin < t.endMin;
    rows[rowIdx]?.classList.toggle('current-row', isCurrent);
    rowIdx++;
    if (t.pitstopAfter) {
      const isPit = nowMin >= t.endMin && nowMin < t.endMin + PITSTOP_MINUTES;
      rows[rowIdx]?.classList.toggle('current-row', isPit);
      rowIdx++;
    }
  });
}, 30000);
</script>
</body>
</html>
